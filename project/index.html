<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="container">

    <section class="search-area">
      <input type="text" id="cityInput" placeholder="Search city" />
      <button id="searchButton">🔍</button>
    </section>

    <div id="infobox">

      <section class="main-weather">
        <div id="weatherIcon">☀️</div>
        <h1 id="temperature">24°</h1>
        <h2 id="cityName">Sofia</h2>
        <p id="weatherDescription">Sunny • Feels like 26°</p>
      </section>

      <section class="details">
        <div class="detail-card">
          <p class="detail-label">Humidity</p>
          <h3 id="humidity">48%</h3>
        </div>
        <div class="detail-card">
          <p class="detail-label">Wind</p>
          <h3 id="wind">12 km/h</h3>
        </div>
        <div class="detail-card">
          <p class="detail-label">UV Index</p>
          <h3 id="uvIndex">5</h3>
        </div>
      </section>

      <section class="details extra-details">
        <div class="detail-card">
          <p class="detail-label">Sunrise</p>
          <h3 id="sunrise">—</h3>
        </div>
        <div class="detail-card">
          <p class="detail-label">Sunset</p>
          <h3 id="sunset">—</h3>
        </div>
        <div class="detail-card">
          <p class="detail-label">Precip.</p>
          <h3 id="precipitation">—</h3>
        </div>
      </section>

      <section class="forecast">
        <h4 class="forecast-title">5-Day Forecast</h4>
        <div class="forecast-strip" id="forecastStrip"></div>
      </section>

    </div>

  </div>

  <script src="weather.js"></script>
</body>
</html>
